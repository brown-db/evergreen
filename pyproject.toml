[project]
name = "evergreen"
version = "0.1.0"
description = "Evergreen: Efficient Claim Verification for Semantic Aggregates"
authors = [
    {name = "Alexander Lee",email = "a.lee@snowflake.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "multiprocess>=0.70.18",
    "nltk>=3.9.2",
    "snowflake-snowpark-python>=1.45.0",
    "scipy>=1.17.0",
    "tenacity>=9.1.4",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.8",
    "pyright>=1.1.408",
    "scalene>=2.0.1",
    "mkdocs>=1.6.1",
    "mkdocs-llmstxt>=0.5.0",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.2",
    "jupysql>=0.11.1",
    "duckdb>=1.4.4",
    "duckdb-engine>=0.17.0",
    "ipykernel>=7.2.0",
    "pandas>=3.0.0",
    "seaborn>=0.13.2",
    "pandas-stubs>=3.0.0.260204",
    "matplotlib-stubs>=0.3.11",
    "tiktoken>=0.12.0",
    "anthropic>=0.86.0",
    "dspy>=3.1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:snowflake.*",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "experiments"]
exclude = ["src/confseq"]

[tool.ruff]
target-version = "py312"
exclude = ["src/confseq", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (organize imports)
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["evergreen"]
